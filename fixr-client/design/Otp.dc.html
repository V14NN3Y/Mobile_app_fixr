<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Code de vérification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}
*{box-sizing:border-box}
a{color:#0B4F6C;text-decoration:none}a:hover{color:#083B51}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-0.02em}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .12s ease,background .2s ease}
.btn:active{transform:scale(.98)}
.btn-p{background:#0B4F6C;color:#fff}.btn-p:hover{background:#083B51;color:#fff}
.btn-dis{background:#E3E0D8;color:#7A808B;cursor:not-allowed}
.ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#12161F}
.box{height:58px;border-radius:14px;background:#fff;border:1.5px solid #D9D5CC;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;font-weight:700;transition:border-color .15s}
.box-on{border-color:#0B4F6C;box-shadow:0 0 0 4px rgba(11,79,108,.12)}
.box-ok{border-color:#1D7A4E;background:#F3FAF6}
.caret{width:2px;height:26px;background:#0B4F6C;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pop{animation:po .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes po{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F5F1; color: #12161F; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 54px 0 34px">
  <header style="height: 52px; display: flex; align-items: center; padding: 0 12px">
    <a href="Login.dc.html" class="ib" aria-label="Retour"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
  </header>
  <section style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 class="disp" style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Entrez le code reçu</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #4A515E; font-weight: 500">Envoyé par SMS au <strong style="color: #12161F">+229 01 97 45 •• 36</strong>. <a href="Login.dc.html" style="font-weight: 700">Modifier</a></p>
    </div>
    <div role="group" aria-label="Code à 6 chiffres" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
        <div class="{{b.cls}}">
          <sc-if value="{{b.caret}}" hint-placeholder-val="{{ false }}"><span class="caret"></span></sc-if>
          <span class="pop">{{b.d}}</span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <div class="pop" style="display: flex; align-items: center; gap: 8px; color: #1D6B45; font-weight: 700; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Code vérifié
      </div>
    </sc-if>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
      <div style="font-size: 14px; color: #656B77; font-weight: 600">Renvoyer le code dans <strong style="color: #12161F">0:42</strong></div>
    </sc-if>
  </section>

  <footer style="margin-top: auto; padding: 0 24px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{fill}}" style="height: 56px; border-radius: 16px; background: #ffffff; border: 1px solid #E3E0D8; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B4F6C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; font-weight: 600">Code reçu par SMS : <strong>482 917</strong></span>
        <span style="font-weight: 800; font-size: 14px; color: #0B4F6C">Utiliser</span>
      </button>
      <span class="btn btn-dis" aria-disabled="true">Vérifier</span>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <a href="Home.dc.html" class="btn btn-p pop">Continuer</a>
    </sc-if>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '482' }; }
  renderVals() {
    const code = this.state.code;
    const done = code.length === 6;
    const boxes = [0,1,2,3,4,5].map((i) => ({
      d: code[i] || '',
      caret: !done && i === code.length,
      cls: 'box' + (done ? ' box-ok' : (i === code.length ? ' box-on' : ''))
    }));
    return { boxes, done, notDone: !done, fill: () => this.setState({ code: '482917' }) };
  }
}
</script>
</body>
</html>
