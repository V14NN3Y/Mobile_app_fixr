<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}
*{box-sizing:border-box}
a{color:#0B4F6C;text-decoration:none}a:hover{color:#083B51}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-0.02em}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .12s ease,background .2s ease}
.btn:active{transform:scale(.98)}
.btn-p{background:#0B4F6C;color:#fff}.btn-p:hover{background:#083B51;color:#fff}
.btn-s{background:#fff;color:#12161F;border:1.5px solid #D9D5CC}.btn-s:hover{border-color:#12161F}
.ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#12161F}
.lbl{font-size:13px;font-weight:700;color:#12161F}
.field{height:52px;border-radius:14px;background:#fff;border:1.5px solid #D9D5CC;display:flex;align-items:center;gap:10px;padding:0 14px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:#0B4F6C;box-shadow:0 0 0 4px rgba(11,79,108,.12)}
.field input{border:0;outline:0;background:transparent;flex-grow:1;min-width:0;font-size:16px;font-weight:600;height:100%}
.seg{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:14px;color:#4A515E;transition:background .2s,color .2s}
.seg-on{background:#fff;color:#12161F;box-shadow:0 1px 3px rgba(18,22,31,.12)}
.fu{animation:fu .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F5F1; color: #12161F; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 54px 0 34px">
  <header style="height: 52px; display: flex; align-items: center; padding: 0 12px">
    <a href="Main.dc.html" class="ib" aria-label="Retour"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
  </header>

  <section style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 class="disp" style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Bon retour parmi nous</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #4A515E; font-weight: 500">Connectez-vous pour suivre vos demandes et vos artisans.</p>
    </div>

    <div role="tablist" aria-label="Méthode de connexion" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #ECE9E2">
      <button role="tab" class="{{phoneTabClass}}" onClick="{{toPhone}}" aria-selected="{{isPhone}}">Téléphone</button>
      <button role="tab" class="{{emailTabClass}}" onClick="{{toEmail}}" aria-selected="{{isEmail}}">E-mail</button>
    </div>

    <sc-if value="{{isPhone}}" hint-placeholder-val="{{ true }}">
      <div class="fu" style="display: flex; flex-direction: column; gap: 8px">
        <label for="tel" class="lbl">Numéro de téléphone</label>
        <div class="field">
          <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; padding-right: 10px; border-right: 1px solid #E3E0D8; height: 28px">BJ +229</span>
          <input id="tel" type="tel" inputmode="tel" autocomplete="tel" value="01 97 45 12 36">
        </div>
        <span style="font-size: 13px; color: #656B77; font-weight: 500">Nous vous enverrons un code à 6 chiffres par SMS.</span>
      </div>
      <a href="Otp.dc.html" class="btn btn-p" style="margin-top: 0">Recevoir le code</a>
    </sc-if>

    <sc-if value="{{isEmail}}" hint-placeholder-val="{{ false }}">
      <div class="fu" style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="mail" class="lbl">Adresse e-mail</label>
          <div class="field">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#656B77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m4 7 8 6 8-6"></path></svg>
            <input id="mail" type="email" autocomplete="email" value="aurore.tchibozo@gmail.com">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <label for="pwd" class="lbl">Mot de passe</label>
            <a href="#recuperation" style="font-size: 13px; font-weight: 700">Mot de passe oublié ?</a>
          </div>
          <div class="field">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#656B77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            <input id="pwd" type="{{pwdType}}" autocomplete="current-password" value="fixr2026!">
            <button onClick="{{togglePwd}}" aria-label="{{pwdLabel}}" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; color: #4A515E">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <a href="Home.dc.html" class="btn btn-p">Se connecter</a>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #656B77; font-weight: 600">
      <span style="flex-grow: 1; height: 1px; background: #E3E0D8"></span>ou<span style="flex-grow: 1; height: 1px; background: #E3E0D8"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <a href="Home.dc.html" class="btn btn-s">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #D9D5CC; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">G</span>Continuer avec Google</a>
      <a href="Home.dc.html" class="btn btn-s">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #D9D5CC; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">A</span>Continuer avec Apple</a>
    </div>
  </section>

  <footer style="margin-top: auto; text-align: center; font-size: 15px; font-weight: 600; color: #4A515E; padding: 0 24px">
    Pas encore de compte ? <a href="Signup.dc.html" style="font-weight: 800; display: inline-flex; align-items: center; min-height: 44px">Créer un compte</a>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { method: 'phone', showPwd: false }; }
  renderVals() {
    const isPhone = this.state.method === 'phone';
    return {
      isPhone, isEmail: !isPhone,
      phoneTabClass: 'seg' + (isPhone ? ' seg-on' : ''),
      emailTabClass: 'seg' + (!isPhone ? ' seg-on' : ''),
      toPhone: () => this.setState({ method: 'phone' }),
      toEmail: () => this.setState({ method: 'email' }),
      pwdType: this.state.showPwd ? 'text' : 'password',
      pwdLabel: this.state.showPwd ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
      togglePwd: () => this.setState({ showPwd: !this.state.showPwd })
    };
  }
}
</script>
</body>
</html>
